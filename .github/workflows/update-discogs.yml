name: Update Discogs wantlist

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"

permissions:
  contents: write

concurrency:
  group: neocities-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      DISCOGS_USER: Deandro
      NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY || secrets.NEOCITIES_API_TOKEN }}

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Build the wantlist snapshot
        run: python3 scripts/fetch_discogs.py

      - name: Publish the fresh snapshot to Neocities
        if: ${{ env.NEOCITIES_API_KEY != '' }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "data/discogs-wantlist.js=@data/discogs-wantlist.js;type=application/javascript" \
            -F "data/discogs-wantlist.json=@data/discogs-wantlist.json;type=application/json" \
            "https://neocities.org/api/upload"

      - name: Save changed wantlist data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discogs-wantlist.json data/discogs-wantlist.js
          if git diff --cached --quiet; then
            echo "The Discogs wantlist is already current."
            exit 0
          fi
          git commit -m "Update Discogs wantlist"
          git pull --rebase origin main
          git push origin HEAD:main
