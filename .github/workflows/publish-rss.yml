name: Publish RSS to Neocities

on:
  push:
    branches:
      - main
    paths:
      - "Now.md"
      - "generate_rss.py"
      - ".github/workflows/publish-rss.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RSS generator dependency
        run: python -m pip install markdown

      - name: Generate rss.xml from Now.md history
        run: python generate_rss.py

      - name: Upload rss.xml to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          if [ -z "$NEOCITIES_API_KEY" ]; then
            echo "Missing GitHub Actions secret: NEOCITIES_API_KEY"
            exit 1
          fi

          curl --fail-with-body \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "rss.xml=@rss.xml;type=application/rss+xml" \
            "https://neocities.org/api/upload"
